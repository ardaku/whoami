on: [push, pull_request]

name: tests

env:
  RUSTUP_AUTO_INSTALL: 0

jobs:
  checks:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        tc: [nightly]
    steps:
    - uses: taiki-e/checkout-action@v1
    - uses: taiki-e/install-action@v2
    - run: rustup set profile minimal
    - run: rustup toolchain install ${{ matrix.tc }}
    - run: cargo update
    - run: cargo fmt --check
    - run: cargo clippy -- -D warnings
  checks-cross-compile:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        tc: [nightly]
        cc:
        - aarch64-linux-android
        - i686-pc-windows-gnu
        - i686-unknown-freebsd
        - i686-unknown-linux-gnu
        - wasm32-wasip1
        - x86_64-apple-darwin
    steps:
    - uses: taiki-e/checkout-action@v1
    - uses: taiki-e/install-action@v2
    - run: rustup set profile minimal
    - run: rustup toolchain install ${{ matrix.tc }}
    - run: rustup target add ${{ matrix.cc }}
    - run: cargo update
    - run: cargo clippy --all-features --target=${{ matrix.cc }} -- -D warnings
  checks-cross-compile-ios:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest]
        tc: [nightly]
        cc: [aarch64-apple-ios]
    steps:
    - uses: taiki-e/checkout-action@v1
    - uses: taiki-e/install-action@v2
    - run: rustup set profile minimal
    - run: rustup toolchain install ${{ matrix.tc }}
    - run: rustup target add ${{ matrix.cc }}
    - run: cargo clippy --all-features --target=${{ matrix.cc }} -- -D warnings
  checks-cross-compile-wasm:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        tc: [nightly]
        cc: [wasm32-unknown-unknown]
    steps:
    - uses: taiki-e/checkout-action@v1
    - uses: taiki-e/install-action@v2
    - run: rustup set profile minimal
    - run: rustup toolchain install ${{ matrix.tc }}
    - run: rustup target add ${{ matrix.cc }}
    - run: cargo clippy --all-features --target=${{ matrix.cc }} -- -D warnings
    - run: cargo update
    - run: cargo clippy --no-default-features --target=${{ matrix.cc }} -- -D warnings
    - run: RUSTFLAGS="--cfg daku" cargo clippy --target=${{ matrix.cc }} -- -D warnings
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        tc: [1.65.0, stable, beta, nightly]
    steps:
    - uses: taiki-e/checkout-action@v1
    - uses: taiki-e/install-action@v2
    - run: rustup set profile minimal
    - run: rustup toolchain install ${{ matrix.tc }}
    - run: cargo doc
    - run: cargo test --all --all-features
  cross-compile:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        tc: [1.65.0, stable, beta, nightly]
        cc:
        - aarch64-linux-android
        - i686-pc-windows-gnu
        - i686-unknown-freebsd
        - i686-unknown-linux-gnu
        - wasm32-wasip1
        - x86_64-apple-darwin
    steps:
    - uses: taiki-e/checkout-action@v1
    - uses: taiki-e/install-action@v2
    - run: rustup set profile minimal
    - run: rustup toolchain install ${{ matrix.tc }}
    - run: rustup target add ${{ matrix.cc }}
    - run: cargo build --all-features --target=${{ matrix.cc }} -p whoami
  cross-compile-ios:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest]
        tc: [1.65.0, stable, beta, nightly]
        cc: [aarch64-apple-ios]
    steps:
    - uses: taiki-e/checkout-action@v1
    - uses: taiki-e/install-action@v2
    - run: rustup set profile minimal
    - run: rustup toolchain install ${{ matrix.tc }}
    - run: rustup target add ${{ matrix.cc }}
    - run: cargo build --all-features --target=${{ matrix.cc }}
  cross-compile-wasm:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        tc: [1.65.0, stable, beta, nightly]
        cc: [wasm32-unknown-unknown]
    steps:
    - uses: taiki-e/checkout-action@v1
    - uses: taiki-e/install-action@v2
    - run: rustup set profile minimal
    - run: rustup toolchain install ${{ matrix.tc }}
    - run: rustup target add ${{ matrix.cc }}
    - run: cargo build --all-features --target=${{ matrix.cc }}
    - run: cargo update
    - run: cargo build --no-default-features --target=${{ matrix.cc }}
    - run: RUSTFLAGS="--cfg daku" cargo build --target=${{ matrix.cc }}
  test-wasm:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        tc: [stable, nightly]
    steps:
    - uses: taiki-e/checkout-action@v1
    - uses: taiki-e/install-action@v2
    - name: Install wasm-pack
      run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
    - name: Setup Chrome for headless testing
      uses: browser-actions/setup-chrome@latest
    - run: rustup set profile minimal
    - run: rustup toolchain install ${{ matrix.tc }}
    - run: rustup target add wasm32-unknown-unknown
    # TODO: Consider using wasmtime instead of Chrome for faster, lighter CI
    # wasmtime would eliminate browser dependencies and improve test performance
    - name: Run WASM tests in headless browser
      run: |
        cd whoami
        wasm-pack test --headless --chrome --all-features
    - name: Run WASM tests for web feature
      run: |
        cd whoami
        wasm-pack test --headless --chrome --features web
    - name: Run WASM tests without default features
      run: |
        cd whoami
        wasm-pack test --headless --chrome --no-default-features
  cross-compile-illumos:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        tc: [1.65.0, stable, beta, nightly]
        cc: [x86_64-unknown-illumos]
    steps:
    - uses: taiki-e/checkout-action@v1
    - uses: taiki-e/install-action@v2
    - run: rustup set profile minimal
    - run: rustup toolchain install ${{ matrix.tc }}
    - run: rustup target add ${{ matrix.cc }}
    - run: cargo build --all-features --target=${{ matrix.cc }} -p whoami
  cross-compile-redox:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        tc: [1.65.0, stable, beta, nightly]
        cc: [x86_64-unknown-redox]
    steps:
    - uses: taiki-e/checkout-action@v1
    - uses: taiki-e/install-action@v2
    - run: rustup set profile minimal
    - run: rustup toolchain install ${{ matrix.tc }}
    - run: rustup target add ${{ matrix.cc }}
    - run: cargo build --all-features --target=${{ matrix.cc }} -p whoami
  clippy-cross-compile:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        tc: [nightly]
        cc:
        - x86_64-unknown-illumos
        - x86_64-unknown-redox
    steps:
    - uses: taiki-e/checkout-action@v1
    - uses: taiki-e/install-action@v2
    - run: rustup set profile minimal
    - run: rustup toolchain install ${{ matrix.tc }}
    - run: rustup target add ${{ matrix.cc }}
    - run: cargo clippy --all-features --target=${{ matrix.cc }} -- -D warnings
